<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐 먹지?</title>
<style>
  :root{
    --bg: #1f231d;
    --surface: #262b21;
    --surface-2: #313728;
    --border: #454c3d;
    --accent: #e8a33d;
    --accent-ink: #1f231d;
    --stamp: #c1443c;
    --recent: #6fc3a9;
    --fav: #ff9db5;
    --text: #f4efe6;
    --text-muted: #a3a68f;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .app{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .content{
    flex: 1;
    padding: 0 0 100px;
  }
  .page{ padding: 22px 20px 0; }

  /* 상단 고정 얇은 창들 */
  .topstack{
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
    padding: 8px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 12px rgba(0,0,0,.35);
  }
  .win{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .win-head{
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; cursor: pointer; user-select: none;
  }
  .dname{ font-weight: 800; color: var(--accent); font-size: 13px; white-space: nowrap; }
  .dstat{
    flex: 1; min-width: 0; text-align: right; font-size: 11px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .caret{ font-size: 10px; color: var(--text-muted); }
  .win-body{ padding: 0 10px 10px; }
  .win-keys{ padding: 6px 8px; }
  .chip-row{
    display: flex; gap: 6px; overflow-x: auto; white-space: nowrap;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chip-row::-webkit-scrollbar{ display: none; }
  .chip-row .chip{ flex: none; padding: 5px 11px; font-size: 12px; }
  .win-mode{ display: flex; align-items: center; gap: 10px; padding: 5px 8px; }
  .win-mode .seg-btn{ padding: 4px 10px; font-size: 12px; }
  .win-mode .hint{
    flex: 1; min-width: 0; font-size: 11px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .win-act{ display: flex; gap: 8px; padding: 6px; }
  .act-clear{
    padding: 0 14px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 8px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; user-select: none;
  }
  .win-act .roll-btn{ margin: 0; padding: 10px; font-size: 14px; flex: 1; border-radius: 8px; }
  .stamp-on-ticket{
    position: absolute; top: 16px; right: 12px;
    background: var(--stamp); color: #fff; font-size: 14px; font-weight: 900;
    padding: 6px 12px; border-radius: 8px; border: 2px solid #fff;
    transform: scale(3) rotate(-14deg); opacity: 0;
    animation: stampDown .35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .ticket.stamping .btn-row{ pointer-events: none; opacity: .5; }
  .title{
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 4px;
  }
  .subtitle{
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .section{ margin-bottom: 20px; }
  .section-label{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
    white-space: nowrap;
  }
  .chip:active{ transform: scale(0.95); }
  .chip.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }
  .menu-pick-list{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 26vh;
    overflow-y: auto;
    padding: 12px;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .menu-pick{
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid transparent;
  }
  .menu-pick.active{
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }
  .roll-btn{
    margin-top: 4px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .roll-btn:active{ transform: scale(0.98); }
  .stage{ margin-top: 22px; }
  .empty{
    width: 100%;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 20px;
    line-height: 1.6;
  }
  .no-match{ color: var(--stamp); font-weight: 700; border-color: var(--stamp); }
  .ticket{
    width: 100%;
    background: var(--surface);
    border-radius: 4px;
    position: relative;
    padding: 30px 22px 22px;
    overflow: hidden;
    text-align: center;
  }
  .ticket::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background:
      radial-gradient(circle at 10px 0px, transparent 6px, var(--bg) 6.5px) top left,
      var(--surface);
    background-size: 20px 20px;
    background-repeat: repeat-x;
  }
  .ticket-emoji{
    font-size: 56px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .ticket-eyebrow{ font-size: 12px; color: var(--text-muted); margin: 4px 0; }
  .ticket-name{
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 4px 0 14px;
    min-height: 30px;
  }
  .ticket-tags{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tag{
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-row{ display: flex; gap: 8px; }
  .confirm-btn, .reroll-btn{
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .confirm-btn{ border: none; background: var(--accent); color: var(--accent-ink); }
  .reroll-btn{ border: 1px solid var(--border); background: transparent; color: var(--text); }

  /* bottom nav */
  .navbar{
    position: sticky;
    bottom: 0;
    left: 0; right: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    max-width: 420px;
    margin: 0 auto;
  }
  .navbtn{
    flex: 1;
    padding: 12px 0 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .navbtn .ico{ font-size: 20px; }
  .navbtn.active{ color: var(--accent); font-weight: 700; }

  /* categories tab */
  .menu-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-card .em{ font-size: 26px; }
  .menu-card .info{ flex: 1; min-width:0; }
  .menu-card .nm{ font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .menu-card .tg{ display:flex; flex-wrap: wrap; gap: 4px; }
  .menu-card .actions{ display: flex; flex-direction: column; gap: 6px; }
  .icon-btn{
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .icon-btn.danger{ color: var(--stamp); border-color: var(--stamp); }

  .form-box{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .form-row{ margin-bottom: 10px; }
  .form-row label{ display:block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .form-row input{
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
  }
  .form-actions{ display:flex; gap: 8px; margin-top: 12px; }
  .primary-btn, .ghost-btn{
    flex:1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor:pointer;
  }
  .primary-btn{ border:none; background: var(--accent); color: var(--accent-ink); }
  .ghost-btn{ border: 1px solid var(--border); background: transparent; color: var(--text); }

  .confirm-inline{ display:flex; gap:6px; }
  .form-row textarea{
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .chip, .menu-pick{ -webkit-touch-callout: none; user-select: none; touch-action: manipulation; }
  .star{ display: none; color: var(--fav); margin-right: 3px; font-size: 11px; }
  .fav > .star{ display: inline; }
  .active > .star{ color: var(--accent-ink); }
  .chip.recent:not(.active){ border-color: var(--recent); color: var(--recent); background: rgba(111,195,169,.10); }
  .menu-pick.recent:not(.active){ outline: 1px solid var(--recent); color: var(--recent); background: rgba(111,195,169,.10); }
  .win-fav{ display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
  .fav-mark{ color: var(--fav); font-size: 13px; flex: none; }
  .win-fav .chip-row{ flex: 1; min-width: 0; }
  .win-fav .star{ display: none !important; }
  .legend{ margin-top: 18px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  .cnt{ opacity:.65; margin-left:5px; font-size:11px; }
  .chip.active .cnt{ opacity:.8; }
  .seg{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg-btn{ padding:3px 10px; font-size:11px; cursor:pointer; color:var(--text-muted); }
  .seg-btn.on{ background:var(--accent); color:var(--accent-ink); font-weight:800; }
  .section-label.toggle{ cursor:pointer; user-select:none; }
  .search{
    width:100%; padding:9px 12px; margin-bottom:8px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px;
  }
  .muted-note{ font-size:12px; color:var(--text-muted); }
  .cat-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cat-head .section-label{ margin-bottom:0; }
  .deadbox{ background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .deadbox .section-label{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .deadbox .clean-all{ font-size:11px; color:var(--stamp); cursor:pointer; font-weight:700; }
  .dead-chip{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; margin:0 6px 6px 0;
    border-radius:999px; background: var(--surface-2); border:1px solid var(--border); font-size:12px; color: var(--text-muted);
  }
  .dead-x{ cursor:pointer; color: var(--stamp); font-weight:800; }
  .more-btn{
    width:100%; padding:11px; margin-top:4px; text-align:center; font-size:13px; font-weight:700;
    border:1px solid var(--border); border-radius:10px; color:var(--text-muted); cursor:pointer;
  }
  .import-msg{ margin-top: 10px; font-size: 13px; line-height: 1.6; color: var(--accent); }
  .import-tags{ margin-top: 10px; font-size: 12px; color: var(--text-muted); line-height: 1.7; word-break: break-all; }

  /* about tab */
  .about-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
  }
  .about-emoji{ font-size: 48px; margin-bottom: 10px; }
  .about-name{ font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .about-desc{ font-size: 13px; color: var(--text-muted); line-height: 1.6; }

  /* stamp overlay */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.show{ opacity: 1; pointer-events: all; }
  .stamp-mark{
    background: var(--stamp);
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    padding: 22px 34px;
    border-radius: 12px;
    border: 4px solid #fff;
    transform: scale(3) rotate(-16deg);
    opacity: 0;
    text-align: center;
  }
  .overlay.show .stamp-mark{
    animation: stampDown .35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampDown{
    0%{ transform: scale(3) rotate(-16deg); opacity: 0; }
    60%{ transform: scale(0.9) rotate(-8deg); opacity: 1; }
    100%{ transform: scale(1) rotate(-8deg); opacity: 1; }
  }
</style>
</head>

<div class="app">
  <div class="content" id="content"></div>
  <div class="navbar" id="navbar"></div>
</div>

<script>
const STORAGE_KEY = "menu-picker:menus";
const LAST_KEY = "menu-picker:last-confirmed";
const TAGS_KEY = "menu-picker:extra-tags";
const PREFS_KEY = "menu-picker:prefs";

const memStore = {};
const store = {
  get(key){
    try{ return window.localStorage.getItem(key); }
    catch(e){ return key in memStore ? memStore[key] : null; }
  },
  set(key, value){
    try{ window.localStorage.setItem(key, value); }
    catch(e){ memStore[key] = value; }
  },
  remove(key){
    try{ window.localStorage.removeItem(key); }
    catch(e){ delete memStore[key]; }
  }
};

const DATA_KEY = "menu-picker:v1";
const SCHEMA_VERSION = 1;
let appData = null;

function emptyData(){
  return { version: SCHEMA_VERSION, menus: null, extraTags: [], favTags: [], favMenus: [], recent: { tags: [], menus: [] }, lastConfirmed: null };
}

// 옛 낱개 키(menu-picker:menus 등)에서 통합 키로 1회 이전. 이전 성공 시 옛 키는 지움
function migrateOldKeys(){
  const d = emptyData();
  let found = false;
  try{ const r = store.get(STORAGE_KEY); if(r){ d.menus = JSON.parse(r); found = true; } }catch(e){}
  try{ const r = store.get(TAGS_KEY); if(r){ d.extraTags = JSON.parse(r); found = true; } }catch(e){}
  try{
    const r = store.get(PREFS_KEY);
    if(r){
      const o = JSON.parse(r);
      d.favTags = Array.isArray(o.favTags) ? o.favTags : [];
      d.favMenus = Array.isArray(o.favMenus) ? o.favMenus : [];
      d.recent = { tags: Array.isArray(o.recent && o.recent.tags) ? o.recent.tags : [], menus: Array.isArray(o.recent && o.recent.menus) ? o.recent.menus : [] };
      found = true;
    }
  }catch(e){}
  try{ const r = store.get(LAST_KEY); if(r){ d.lastConfirmed = JSON.parse(r); found = true; } }catch(e){}
  if(found){
    [STORAGE_KEY, TAGS_KEY, PREFS_KEY, LAST_KEY].forEach(k => store.remove(k));
  }
  return d;
}

function persistAll(){
  try{ store.set(DATA_KEY, JSON.stringify(appData)); }catch(e){ /* ignore */ }
}

function ensureData(){
  if(appData) return;
  try{
    const r = store.get(DATA_KEY);
    if(r){ appData = Object.assign(emptyData(), JSON.parse(r)); return; }
  }catch(e){}
  appData = migrateOldKeys();
  persistAll();
}

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function loadExtraTags(){
  ensureData();
  state.extraTags = Array.isArray(appData.extraTags) ? appData.extraTags : [];
}

function saveExtraTags(){
  ensureData();
  appData.extraTags = state.extraTags;
  persistAll();
}

function allowedTags(){
  const s = new Set(allTags());
  state.extraTags.forEach(t => s.add(t));
  return [...s];
}

// extraTags로 등록됐지만 어떤 메뉴도 쓰지 않는 "죽은 태그"
function deadExtraTags(){
  return state.extraTags.filter(t => !state.menus.some(m => m.tags.includes(t)));
}

function removeDeadTag(t){
  state.extraTags = state.extraTags.filter(x => x !== t);
  state.favTags = state.favTags.filter(x => x !== t);
  state.filters.delete(t);
  saveExtraTags();
  savePrefs();
}

function deadBoxHtml(){
  const dead = deadExtraTags();
  if(dead.length === 0) return "";
  const chips = dead.map(t => `<span class="dead-chip">#${esc(t)}<span class="dead-x" data-deadtag="${esc(t)}">×</span></span>`).join("");
  return `
    <div class="deadbox" id="deadBox">
      <div class="section-label"><span>사용하지 않는 태그 (${dead.length})</span><span class="clean-all" id="cleanAllBtn">전부 정리</span></div>
      ${chips}
    </div>`;
}

function refreshDeadBox(){
  const anchor = document.getElementById("deadBoxAnchor");
  if(!anchor) return;
  anchor.innerHTML = deadBoxHtml();
  bindDeadBox(anchor);
  refreshHomeIfNeeded();
}

function bindDeadBox(root){
  const r = root || document;
  r.querySelectorAll("[data-deadtag]").forEach(el => {
    el.addEventListener("click", () => { removeDeadTag(el.dataset.deadtag); refreshDeadBox(); });
  });
  const cleanAll = r.querySelector("#cleanAllBtn");
  if(cleanAll) cleanAll.addEventListener("click", () => {
    deadExtraTags().forEach(t => removeDeadTag(t));
    refreshDeadBox();
  });
}

function refreshHomeIfNeeded(){
  // 홈 화면이 떠 있을 때만 키워드 칩 쪽을 다시 그림 (태그 정리로 칩 목록이 바뀌므로)
  const row = document.getElementById("chipRow");
  if(row && state.tab === "recommend") render();
}

let idSeq = 0;
function newId(){ return Date.now() + "-" + (idSeq++); }

// 원본 텍스트(붙여넣은 textarea 기준) 줄 번호를 유지한 채 주석/빈 줄만 걸러냄.
// 블록 주석은 내용만 지우고 그만큼의 줄바꿈은 남겨서 이후 줄 번호가 안 밀리게 함
function numberedLines(text){
  const noBlock = text.replace(/^\uFEFF/, "").replace(/\/\*[\s\S]*?\*\//g, m => "\n".repeat((m.match(/\n/g) || []).length));
  return noBlock.split(/\r?\n/)
    .map((raw, i) => ({ no: i + 1, text: raw.trim() }))
    .filter(l => l.text && !l.text.startsWith("//"));
}

function applyImport(text){
  const allowed = new Set(allowedTags());
  const byName = new Map(state.menus.map(m => [m.name, m]));
  const res = { added:0, updated:0, dup:0, missing:0, bad:0, newTags:0, favs:0, dropped:new Set(), badLines:[], missingLines:[] };
  const lines = numberedLines(text); // [{no, text}], no = 붙여넣은 원문 기준 줄 번호

  // 1) 태그 등록 명령
  lines.forEach(({ text: line }) => {
    if(!line.startsWith("#태그")) return;
    line.replace(/^#태그\s*/, "").split(",")
      .map(t => t.trim().replace(/^#/, "")).filter(Boolean)
      .forEach(t => {
        if(t.length <= 20 && !allowed.has(t)){
          allowed.add(t); state.extraTags.push(t); res.newTags++;
        }
      });
  });

  // 2) 메뉴 추가/수정 (이모지 | 이름 | 태그, 태그)
  let mode = "add";
  lines.forEach(({ no, text: line }) => {
    if(line.startsWith("#태그") || line.startsWith("#즐겨찾기")) return;
    if(line === "#수정"){ mode = "edit"; return; }
    if(line === "#추가"){ mode = "add"; return; }
    if(line.startsWith("#")){ res.bad++; res.badLines.push(no); return; }
    const parts = line.split("|").map(x => x.trim());
    if(parts.length !== 3 || !parts[1] || parts[1].length > 30 || parts[0].length > 8){
      res.bad++; res.badLines.push(no); return;
    }
    const [emoji, name, tagStr] = parts;
    const tags = [];
    tagStr.split(",").map(t => t.trim().replace(/^#/, "")).filter(Boolean).forEach(t => {
      if(allowed.has(t)){ if(!tags.includes(t)) tags.push(t); }
      else res.dropped.add(t);
    });
    const existing = byName.get(name);
    if(mode === "add"){
      if(existing){ res.dup++; return; }
      const item = { id:newId(), emoji: emoji || "🍽️", name, tags };
      state.menus.push(item);
      byName.set(name, item);
      res.added++;
    } else {
      if(!existing){ res.missing++; res.missingLines.push(no); return; }
      if(tags.length === 0){ res.bad++; res.badLines.push(no); return; }
      if(emoji) existing.emoji = emoji;
      existing.tags = tags;
      res.updated++;
    }
  });

  // 3) 즐겨찾기 (추가만 함, 기존 즐겨찾기는 유지)
  lines.forEach(({ text: line }) => {
    if(line.startsWith("#즐겨찾기태그")){
      line.replace(/^#즐겨찾기태그\s*/, "").split(",")
        .map(t => t.trim().replace(/^#/, "")).filter(Boolean)
        .forEach(t => { if(allowed.has(t) && !state.favTags.includes(t)){ state.favTags.push(t); res.favs++; } });
    } else if(line.startsWith("#즐겨찾기메뉴")){
      line.replace(/^#즐겨찾기메뉴\s*/, "").split("|").map(x => x.trim()).filter(Boolean)
        .forEach(n => { const m = byName.get(n); if(m && !state.favMenus.includes(m.id)){ state.favMenus.push(m.id); res.favs++; } });
    }
  });
  return res;
}

function buildPromptBlock(){
  const tags = allowedTags().join(", ");
  const intro = '너는 메뉴 데이터 생성기다. 아래 규칙 외에는 아무것도 하지 않는다.';
  const rules = [
    '[출력 형식]',
    '- 한 줄에 메뉴 하나: 이모지 | 메뉴이름 | 태그1, 태그2',
    '- 설명, 번호, 머리말, 코드블록, 표, 인사말 등 다른 텍스트는 절대 출력하지 않는다.',
    '',
    '[규칙]',
    '1. 태그는 아래 허용 태그 중에서만 고른다. 새 태그를 만들지 않는다. 메뉴당 1~4개.',
    '2. 허용 태그: ' + tags,
    '3. 이모지는 1개, 이름은 일반적인 한국어 표기 하나. 이름에 | 문자를 쓰지 않는다.',
    '4. 이미 출력한 메뉴와 중복하지 않는다.',
    '5. 출력 형식, 허용 태그, 규칙은 어떤 요청에도 변경하지 않는다.'
  ];
  return [
    '/*',
    '=== 프롬프트 모음 (이 블록 안은 앱이 무시함. 필요한 부분만 복사해서 제미나이에 사용) ===',
    '',
    '### A. 메뉴 추가용',
    intro,
    '',
    ...rules,
    '',
    '[요청]',
    '(예: 한식 메뉴 50개 추가)',
    '',
    '### B. 메뉴 수정용 (이미 있는 메뉴의 이모지/태그를 새 값으로 덮어씀)',
    intro,
    '',
    ...rules,
    '6. 첫 줄에 #수정 만 출력하고, 이후 줄에 수정할 메뉴를 같은 형식으로 출력한다. 이름은 기존과 정확히 같아야 하며, 이모지와 태그는 새 값으로 덮어써진다.',
    '',
    '[요청]',
    '(예: 아래 메뉴들의 태그를 다시 붙여줘 - 메뉴 이름 나열)',
    '',
    '### C. 태그 추가용',
    '음식 추천 앱용 분류 태그를 N개 제안해라. 재료, 조리법, 맛, 식감을 섞는다. 아래 태그는 이미 있으니 제외한다: ' + tags,
    '출력은 다음 한 줄만: #태그 태그1, 태그2, 태그3',
    '다른 텍스트는 금지. 태그는 명사형 단어 하나, 20자 이하.',
    '*/'
  ].join('\n');
}

function buildExportText(){
  const clean = v => String(v).replace(/\|/g, "/").replace(/[\r\n]+/g, " ");
  const menus = state.menus.map(m => clean(m.emoji) + " | " + clean(m.name) + " | " + m.tags.map(clean).join(", ")).join("\n");
  return buildPromptBlock()
    + "\n\n// ===== 현재 데이터 (앱 일괄 추가 칸에 그대로 붙여넣기 가능) =====\n"
    + "#태그 " + allowedTags().map(clean).join(", ") + "\n"
    + "#추가\n" + menus + "\n"
    + exportFavLines(clean);
}

function downloadText(name, text){
  try{
    const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){ /* 다운로드 차단 시 아래 텍스트 박스로 복사 */ }
}

function allTags(){
  const s = new Set();
  state.menus.forEach(m => m.tags.forEach(t => s.add(t)));
  return [...s];
}

function getPool(){
  const hasFilter = state.filters.size > 0;
  const hasCandidates = state.candidates.size > 0;
  if(!hasFilter && !hasCandidates){
    return state.menus.slice();
  }
  const fromFilter = hasFilter
    ? state.menus.filter(m => state.matchMode === "and"
        ? [...state.filters].every(t => m.tags.includes(t))
        : m.tags.some(t => state.filters.has(t)))
    : [];
  const fromCandidates = state.menus.filter(m => state.candidates.has(m.id));
  const map = new Map();
  [...fromFilter, ...fromCandidates].forEach(m => map.set(m.id, m));
  return [...map.values()];
}

function pickListHtml(){
  const q = state.menuQuery.trim().toLowerCase();
  const list = q ? state.menus.filter(m => m.name.toLowerCase().includes(q)) : state.menus;
  if(list.length === 0) return '<span class="muted-note">일치하는 메뉴 없음</span>';
  const shown = list.slice(0, 300);
  return shown.map(m => `<div class="menu-pick ${menuCls(m.id)}" data-cand="${esc(m.id)}"><span class="star">★</span><span>${esc(m.emoji)}</span><span>${esc(m.name)}</span></div>`).join("")
    + (list.length > shown.length ? `<span class="muted-note">외 ${list.length - shown.length}개 - 검색으로 좁혀봐</span>` : "");
}

function poolHint(){
  const f = [...state.filters].map(t => "#" + t).join(" ");
  const hasF = state.filters.size > 0;
  const hasC = state.candidates.size > 0;
  if(!hasF && !hasC) return "조건 없음 · 전체에서 뽑기";
  if(!hasF) return `직접 고른 ${state.candidates.size}개에서 뽑기`;
  const base = state.matchMode === "and" ? `${f} 모두 가진 메뉴` : `${f} 중 하나라도 가진 메뉴`;
  return hasC ? `${base} 또는 직접 고른 ${state.candidates.size}개` : base;
}

function refreshHomeCounts(){
  syncMarks();
  const c = document.getElementById("candCount");
  if(c) c.textContent = state.candidates.size;
  const h = document.getElementById("hintText");
  if(h) h.textContent = poolHint();
  const b = document.getElementById("rollBtn");
  if(b) b.textContent = `메뉴 뽑기 (후보 ${getPool().length}개)`;
}

function loadPrefs(){
  ensureData();
  const arr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
  state.favTags = arr(appData.favTags);
  state.favMenus = arr(appData.favMenus);
  state.recent = { tags: arr(appData.recent && appData.recent.tags), menus: arr(appData.recent && appData.recent.menus) };
}

function savePrefs(){
  ensureData();
  appData.favTags = state.favTags;
  appData.favMenus = state.favMenus;
  appData.recent = state.recent;
  persistAll();
}

function pushFront(arr, items, cap){
  items.forEach(x => {
    const i = arr.indexOf(x);
    if(i >= 0) arr.splice(i, 1);
    arr.unshift(x);
  });
  if(arr.length > cap) arr.length = cap;
}

function pushRecentSelection(){
  pushFront(state.recent.tags, [...state.filters], 8);
  pushFront(state.recent.menus, [...state.candidates], 8);
  savePrefs();
}

function tagCls(t){
  return [state.filters.has(t) ? "active" : "", state.favTags.includes(t) ? "fav" : "", state.recent.tags.includes(t) ? "recent" : ""].join(" ").trim();
}
function menuCls(id){
  return [state.candidates.has(id) ? "active" : "", state.favMenus.includes(id) ? "fav" : "", state.recent.menus.includes(id) ? "recent" : ""].join(" ").trim();
}

function syncMarks(){
  document.querySelectorAll("[data-filter]").forEach(el => {
    const t = el.dataset.filter;
    el.classList.toggle("active", state.filters.has(t));
    el.classList.toggle("fav", state.favTags.includes(t));
    el.classList.toggle("recent", state.recent.tags.includes(t));
  });
  document.querySelectorAll("[data-cand]").forEach(el => {
    const id = el.dataset.cand;
    el.classList.toggle("active", state.candidates.has(id));
    el.classList.toggle("fav", state.favMenus.includes(id));
    el.classList.toggle("recent", state.recent.menus.includes(id));
  });
}

function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){} }

// 탭 = onTap, 500ms 꾹 누르기 = onLong. 스크롤/드래그하면 취소
function attachPress(el, onTap, onLong){
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener("pointerdown", e => {
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => { timer = null; onLong(); }, 500);
  });
  el.addEventListener("pointermove", e => {
    if(timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) cancel();
  });
  el.addEventListener("pointerup", () => { if(timer){ cancel(); onTap(); } });
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("contextmenu", e => e.preventDefault());
}

function toggleFavTag(t){
  const i = state.favTags.indexOf(t);
  if(i >= 0) state.favTags.splice(i, 1); else state.favTags.push(t);
  savePrefs(); haptic(); syncMarks(); refreshFavRow();
}
function toggleFavMenu(id){
  const i = state.favMenus.indexOf(id);
  if(i >= 0) state.favMenus.splice(i, 1); else state.favMenus.push(id);
  savePrefs(); haptic(); syncMarks(); refreshFavRow();
}

function favRowHtml(){
  const ok = new Set(allowedTags());
  const parts = [];
  state.favTags.filter(t => ok.has(t)).forEach(t => {
    parts.push(`<div class="chip ${tagCls(t)}" data-filter="${esc(t)}">#${esc(t)}</div>`);
  });
  state.favMenus.map(id => state.menus.find(m => m.id === id)).filter(Boolean).forEach(m => {
    parts.push(`<div class="chip ${menuCls(m.id)}" data-cand="${esc(m.id)}">${esc(m.emoji)} ${esc(m.name)}</div>`);
  });
  return parts.length ? parts.join("") : '<span class="muted-note">칩이나 메뉴를 꾹 눌러서 즐겨찾기 추가</span>';
}

function refreshFavRow(){
  const row = document.getElementById("favRow");
  if(!row) return;
  row.innerHTML = favRowHtml();
  bindFilterEls(row);
  bindCand(row);
}

function bindFilterEls(root){
  (root || document).querySelectorAll("[data-filter]").forEach(el => {
    const t = el.dataset.filter;
    attachPress(el, () => {
      if(state.filters.has(t)) state.filters.delete(t); else state.filters.add(t);
      refreshHomeCounts();
    }, () => toggleFavTag(t));
  });
}

function bindCand(root){
  (root || document).querySelectorAll("[data-cand]").forEach(el => {
    const id = el.dataset.cand;
    attachPress(el, () => {
      if(state.candidates.has(id)) state.candidates.delete(id); else state.candidates.add(id);
      refreshHomeCounts();
    }, () => toggleFavMenu(id));
  });
}

function exportFavLines(clean){
  let out = "";
  const ok = new Set(allowedTags());
  const ft = state.favTags.filter(t => ok.has(t));
  const fm = state.favMenus.map(id => state.menus.find(m => m.id === id)).filter(Boolean).map(m => clean(m.name));
  if(ft.length) out += "#즐겨찾기태그 " + ft.map(clean).join(", ") + "\n";
  if(fm.length) out += "#즐겨찾기메뉴 " + fm.join(" | ") + "\n";
  return out;
}

function setTab(tab){
  state.tab = tab;
  state.editingId = null;
  state.pendingDelete = null;
  state.importMsg = "";
  state.exportText = "";
  if(tab !== "categories"){ state.catQuery = ""; state.catLimit = 50; }
  if(tab === "recommend"){
    state.stage = state.lastConfirmed ? "last" : "idle";
    state.currentResult = null;
  }
  render();
}

function render(){
  renderNav();
  const c = document.getElementById("content");
  const oldRow = document.getElementById("chipRow");
  const keepScroll = oldRow ? oldRow.scrollLeft : 0;
  const oldFav = document.getElementById("favRow");
  const keepFav = oldFav ? oldFav.scrollLeft : 0;
  if(state.tab === "recommend") c.innerHTML = renderRecommend();
  else if(state.tab === "categories") c.innerHTML = `<div class="page">${renderCategories()}</div>`;
  else c.innerHTML = `<div class="page">${renderAbout()}</div>`;
  const newRow = document.getElementById("chipRow");
  if(newRow) newRow.scrollLeft = keepScroll;
  const newFav = document.getElementById("favRow");
  if(newFav) newFav.scrollLeft = keepFav;
  bindEvents();
}

function renderNav(){
  const nav = document.getElementById("navbar");
  const items = [
    {id:"recommend", ico:"🎲", label:"메뉴 추천"},
    {id:"categories", ico:"📋", label:"카테고리 목록"},
    {id:"about", ico:"👤", label:"제작자"}
  ];
  nav.innerHTML = items.map(it => `
    <div class="navbtn ${state.tab===it.id?'active':''}" data-nav="${it.id}">
      <div class="ico">${it.ico}</div>
      <div>${it.label}</div>
    </div>
  `).join("");
}

function renderRecommend(){
  const counts = {};
  state.menus.forEach(m => m.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const chips = allowedTags().map(t => `
    <div class="chip ${tagCls(t)}" data-filter="${esc(t)}"><span class="star">★</span>#${esc(t)}<span class="cnt">${counts[t] || 0}</span></div>
  `).join("");

  let stageHtml = "";
  if(state.stage === "idle"){
    stageHtml = `<div class="empty">키워드를 고르거나 메뉴를 직접 골라서<br>위의 [메뉴 뽑기]를 눌러봐</div>`;
  } else if(state.stage === "last"){
    const item = state.lastConfirmed;
    const tagHtml = item.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("");
    stageHtml = `
      <div class="ticket">
        <div class="ticket-emoji">${esc(item.emoji)}</div>
        <div class="ticket-eyebrow">최근 확정한 메뉴</div>
        <div class="ticket-name">${esc(item.name)}</div>
        <div class="ticket-tags">${tagHtml}</div>
        <div class="btn-row">
          <div class="reroll-btn" id="newRollBtn">다른 메뉴 뽑기</div>
        </div>
      </div>`;
  } else if(state.stage === "no-match"){
    stageHtml = `<div class="empty no-match">조건에 맞는 메뉴가 없어<br>필터를 줄여봐</div>`;
  } else if(state.stage === "rolling"){
    stageHtml = `
      <div class="ticket">
        <div class="ticket-emoji" id="rollEmoji">🍽️</div>
        <div class="ticket-eyebrow">고르는 중...</div>
        <div class="ticket-name" id="rollName">-</div>
      </div>`;
  } else if(state.stage === "result" && state.currentResult){
    const item = state.currentResult;
    const tagHtml = item.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("");
    stageHtml = `
      <div class="ticket">
        <div class="ticket-emoji">${esc(item.emoji)}</div>
        <div class="ticket-eyebrow">오늘의 추천</div>
        <div class="ticket-name">${esc(item.name)}</div>
        <div class="ticket-tags">${tagHtml}</div>
        <div class="btn-row">
          <div class="reroll-btn" id="rerollBtn">다시 추천하기</div>
          <div class="confirm-btn" id="confirmBtn">확정하기</div>
        </div>
      </div>`;
  }

  return `
    <div class="topstack">
      <div class="win">
        <div class="win-head" id="menuToggle">
          <span class="dname">소원이의 먹데이터</span>
          <span class="dstat">메뉴 ${state.menus.length} · 키워드 ${allowedTags().length} · 선택 <span id="candCount">${state.candidates.size}</span></span>
          <span class="caret">${state.menuOpen ? "▲" : "▼"}</span>
        </div>
        ${state.menuOpen ? `
          <div class="win-body">
            <input class="search" id="menuSearch" type="text" placeholder="메뉴 검색" value="${esc(state.menuQuery)}">
            <div class="menu-pick-list" id="pickList">${pickListHtml()}</div>
          </div>` : ""}
      </div>

      <div class="win win-fav">
        <span class="fav-mark">★</span>
        <div class="chip-row" id="favRow">${favRowHtml()}</div>
      </div>

      <div class="win win-keys">
        <div class="chip-row" id="chipRow">${chips || '<span class="muted-note">등록된 키워드가 없어</span>'}</div>
      </div>

      <div class="win win-mode">
        <span class="seg">
          <span class="seg-btn ${state.matchMode==='and'?'on':''}" data-mode="and">모두 포함</span>
          <span class="seg-btn ${state.matchMode==='or'?'on':''}" data-mode="or">하나라도</span>
        </span>
        <span class="hint" id="hintText">${esc(poolHint())}</span>
      </div>

        <div class="act-clear" id="clearBtn">해제</div>
        <button class="roll-btn" id="rollBtn">메뉴 뽑기 (후보 ${getPool().length}개)</button>
      </div>
    </div>

    <div class="page">
      <div class="stage" style="margin-top:0">${stageHtml}</div>
      <div class="legend"><span style="color:var(--recent)">청록색</span> = 최근 선택 · <span style="color:var(--fav)">★</span> = 즐겨찾기 (키워드/메뉴를 꾹 눌러 추가·해제)</div>
    </div>
  `;
}

function categoryFilteredMenus(){
  const q = state.catQuery.trim().toLowerCase().replace(/^#/, "");
  if(!q) return state.menus;
  return state.menus.filter(m => m.name.toLowerCase().includes(q) || m.tags.some(t => t.toLowerCase().includes(q)));
}

function catListHtml(){
  const filtered = categoryFilteredMenus();
  if(filtered.length === 0) return '<div class="muted-note">일치하는 메뉴 없음</div>';
  const shown = filtered.slice(0, state.catLimit);
  const cards = shown.map(m => {
    const tagHtml = m.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("");
    const isPendingDelete = state.pendingDelete === m.id;
    return `
      <div class="menu-card">
        <div class="em">${esc(m.emoji)}</div>
        <div class="info">
          <div class="nm">${esc(m.name)}</div>
          <div class="tg">${tagHtml}</div>
        </div>
        <div class="actions">
          ${isPendingDelete ? `
            <div class="confirm-inline">
              <div class="icon-btn danger" data-delconfirm="${esc(m.id)}">삭제</div>
              <div class="icon-btn" data-delcancel="${esc(m.id)}">취소</div>
            </div>
          ` : `
            <div class="icon-btn" data-edit="${esc(m.id)}">수정</div>
            <div class="icon-btn danger" data-del="${esc(m.id)}">삭제</div>
          `}
        </div>
      </div>
    `;
  }).join("");
  const more = filtered.length > shown.length
    ? `<div class="more-btn" id="catMoreBtn">더 보기 (${filtered.length - shown.length}개 남음)</div>`
    : "";
  return cards + more;
}

function bindCatList(root){
  const r = root || document;
  r.querySelectorAll("[data-edit]").forEach(el => {
    el.addEventListener("click", () => { state.editingId = el.dataset.edit; state.pendingDelete = null; render(); });
  });
  r.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", () => { state.pendingDelete = el.dataset.del; refreshCatList(); });
  });
  r.querySelectorAll("[data-delcancel]").forEach(el => {
    el.addEventListener("click", () => { state.pendingDelete = null; refreshCatList(); });
  });
  r.querySelectorAll("[data-delconfirm]").forEach(el => {
    el.addEventListener("click", async () => {
      const id = el.dataset.delconfirm;
      state.menus = state.menus.filter(m => m.id !== id);
      state.candidates.delete(id);
      state.favMenus = state.favMenus.filter(x => x !== id);
      state.recent.menus = state.recent.menus.filter(x => x !== id);
      savePrefs();
      state.pendingDelete = null;
      await saveMenus();
      refreshCatList();
      refreshDeadBox();
    });
  });
  const moreBtn = r.querySelector("#catMoreBtn");
  if(moreBtn) moreBtn.addEventListener("click", () => { state.catLimit += 50; refreshCatList(); });
}

function refreshCatList(){
  const el = document.getElementById("catList");
  if(!el) return;
  el.innerHTML = catListHtml();
  bindCatList(el);
}

function renderCategories(){
  const editing = state.menus.find(m => m.id === state.editingId);
  const formHtml = `
    <div class="form-box">
      <div class="section-label">${editing ? "메뉴 수정" : "새 메뉴 추가"}</div>
      <div class="form-row">
        <label>이모지</label>
        <input type="text" id="fEmoji" maxlength="4" value="${esc(editing ? editing.emoji : '🍽️')}">
      </div>
      <div class="form-row">
        <label>메뉴 이름</label>
        <input type="text" id="fName" value="${esc(editing ? editing.name : '')}" placeholder="예: 마라샹궈">
      </div>
      <div class="form-row">
        <label>카테고리 (쉼표로 구분)</label>
        <input type="text" id="fTags" value="${esc(editing ? editing.tags.join(', ') : '')}" placeholder="예: 고기, 매운맛">
      </div>
      <div class="form-actions">
        ${editing ? '<div class="ghost-btn" id="cancelEditBtn">취소</div>' : ''}
        <div class="primary-btn" id="saveMenuBtn">${editing ? "수정 완료" : "추가하기"}</div>
      </div>
    </div>
  `;

  const total = state.menus.length;
  const filteredCount = categoryFilteredMenus().length;

  return `
    <div class="title">카테고리 목록</div>
    <p class="subtitle">메뉴별 카테고리를 확인하고 추가·수정·삭제할 수 있어</p>
    ${formHtml}
    ${renderImportBox()}
    <div id="deadBoxAnchor">${deadBoxHtml()}</div>
    <div class="cat-head">
      <div class="section-label">메뉴 목록 (${filteredCount}${state.catQuery.trim() ? ` / 전체 ${total}` : ""})</div>
    </div>
    <input class="search" id="catSearch" type="text" placeholder="이름 또는 #태그로 검색" value="${esc(state.catQuery)}">
    <div id="catList">${catListHtml()}</div>
  `;
}

function renderAbout(){
  return `
    <div class="title">제작자</div>
    <p class="subtitle">&nbsp;</p>
    <div class="about-card">
      <div class="about-emoji">🧑‍🍳</div>
      <div class="about-name">Kiminsu</div>
      <div class="about-desc">여자친구를 위해 만든<br>오늘의 메뉴 추천 앱</div>
    </div>
  `;
}

function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => setTab(el.dataset.nav));
  });

  if(state.tab === "recommend"){
    bindFilterEls(document);
    document.querySelectorAll("[data-mode]").forEach(el => {
      el.addEventListener("click", () => {
        state.matchMode = el.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x.dataset.mode === state.matchMode));
        refreshHomeCounts();
      });
    });
    const clearBtn = document.getElementById("clearBtn");
    if(clearBtn) clearBtn.addEventListener("click", () => { state.filters.clear(); state.candidates.clear(); render(); });
    const menuToggle = document.getElementById("menuToggle");
    if(menuToggle) menuToggle.addEventListener("click", () => { state.menuOpen = !state.menuOpen; render(); });
    const menuSearch = document.getElementById("menuSearch");
    if(menuSearch) menuSearch.addEventListener("input", () => {
      state.menuQuery = menuSearch.value;
      const pl = document.getElementById("pickList");
      pl.innerHTML = pickListHtml();
      bindCand(pl);
    });
    bindCand();
    const rollBtn = document.getElementById("rollBtn");
    if(rollBtn) rollBtn.addEventListener("click", roll);
    const rerollBtn = document.getElementById("rerollBtn");
    if(rerollBtn) rerollBtn.addEventListener("click", roll);
    const newRollBtn = document.getElementById("newRollBtn");
    if(newRollBtn) newRollBtn.addEventListener("click", roll);
    const confirmBtn = document.getElementById("confirmBtn");
    if(confirmBtn) confirmBtn.addEventListener("click", confirmPick);
  }

  if(state.tab === "categories"){
    const importBtn = document.getElementById("importBtn");
    if(importBtn) importBtn.addEventListener("click", async () => {
      const text = document.getElementById("fImport").value;
      if(!text.trim()){ state.importMsg = "입력 없음"; render(); return; }
      const r = applyImport(text);
      await saveMenus();
      saveExtraTags();
      savePrefs();
      let msg = `추가 ${r.added} · 수정 ${r.updated} · 중복 무시 ${r.dup} · 없는 메뉴 ${r.missing} · 형식 오류 ${r.bad}`;
      if(r.newTags) msg += ` · 신규 태그 ${r.newTags}`;
      if(r.favs) msg += ` · 즐겨찾기 +${r.favs}`;
      if(r.badLines.length) msg += `<br>형식 오류 줄: ${r.badLines.join(", ")}번`;
      if(r.missingLines.length) msg += `<br>없는 메뉴라 수정 못한 줄: ${r.missingLines.join(", ")}번`;
      if(r.dropped.size) msg += `<br>허용 목록에 없어 제외된 태그: ` + [...r.dropped].map(t => "#" + esc(t)).join(" ");
      state.importMsg = msg;
      render();
    });
    const exportBtn = document.getElementById("exportBtn");
    if(exportBtn) exportBtn.addEventListener("click", () => {
      state.exportText = buildExportText();
      downloadText("menu-data.txt", state.exportText);
      render();
    });
    const loadBtn = document.getElementById("loadBtn");
    const fFile = document.getElementById("fFile");
    if(loadBtn && fFile){
      loadBtn.addEventListener("click", () => fFile.click());
      fFile.addEventListener("change", () => {
        const f = fFile.files && fFile.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = () => { document.getElementById("fImport").value = String(reader.result || ""); };
        reader.readAsText(f, "utf-8");
      });
    }
    const saveBtn = document.getElementById("saveMenuBtn");
    if(saveBtn) saveBtn.addEventListener("click", saveMenuForm);
    const cancelBtn = document.getElementById("cancelEditBtn");
    if(cancelBtn) cancelBtn.addEventListener("click", () => { state.editingId = null; render(); });
    const catSearch = document.getElementById("catSearch");
    if(catSearch) catSearch.addEventListener("input", () => {
      state.catQuery = catSearch.value;
      state.catLimit = 50;
      refreshCatList();
    });
    bindCatList(document.getElementById("catList"));
    bindDeadBox(document.getElementById("deadBoxAnchor"));
  }
}

async function saveMenuForm(){
  const emoji = document.getElementById("fEmoji").value.trim() || "🍽️";
  const name = document.getElementById("fName").value.trim().replace(/\|/g, "/");
  const tagsRaw = document.getElementById("fTags").value.trim();
  if(!name){ return; }
  const tags = tagsRaw.split(",").map(t => t.trim()).filter(Boolean);

  if(state.editingId){
    const m = state.menus.find(x => x.id === state.editingId);
    if(m){ m.emoji = emoji; m.name = name; m.tags = tags; }
    state.editingId = null;
  } else {
    state.menus.push({ id: String(Date.now()), emoji, name, tags });
  }
  await saveMenus();
  render();
}

function roll(){
  const pool = getPool();
  state.menuOpen = false;
  if(pool.length === 0){
    state.stage = "no-match";
    render();
    return;
  }
  pushRecentSelection();
  state.stage = "rolling";
  render();

  const emojiEl = document.getElementById("rollEmoji");
  const nameEl = document.getElementById("rollName");
  let ticks = 0;
  const maxTicks = 14;
  const spin = setInterval(() => {
    const r = pool[Math.floor(Math.random() * pool.length)];
    if(emojiEl) emojiEl.textContent = r.emoji;
    if(nameEl) nameEl.textContent = r.name;
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(spin);
      state.currentResult = pool[Math.floor(Math.random() * pool.length)];
      state.stage = "result";
      render();
    }
  }, 70);
}

function confirmPick(){
  const picked = state.currentResult;
  const ticket = document.querySelector(".ticket");
  if(ticket){
    const st = document.createElement("div");
    st.className = "stamp-on-ticket";
    st.textContent = "확정!";
    ticket.appendChild(st);
    ticket.classList.add("stamping");
  }
  if(picked){ pushFront(state.recent.menus, [picked.id], 8); savePrefs(); }
  setTimeout(async () => {
    state.filters.clear();
    state.candidates.clear();
    await saveLastConfirmed(picked);
    setTab("recommend");
  }, 1100);
}

(async function init(){
  await loadMenus();
  loadExtraTags();
  loadPrefs();
  await loadLastConfirmed();
  if(state.lastConfirmed) state.stage = "last";
  render();
})();
</script>
</body>
</html>
